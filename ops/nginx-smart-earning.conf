limit_req_zone $binary_remote_addr zone=smart_api:10m rate=20r/s;
upstream smart_earning { server 127.0.0.1:3015; keepalive 32; }
server {
  listen 80;
  listen [::]:80;
  server_name example.com;
  location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
  location / { return 301 https://$host$request_uri; }
}
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name example.com;
  ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_timeout 1d;
  ssl_session_cache shared:SSL:10m;
  client_max_body_size 1m;
  access_log /var/log/nginx/smart-earning.access.log;
  error_log /var/log/nginx/smart-earning.error.log warn;
  location = /api/health/live { proxy_pass http://smart_earning; access_log off; }
  location = /api/health/ready { proxy_pass http://smart_earning; access_log off; }
  location /api/ { limit_req zone=smart_api burst=40 nodelay; proxy_pass http://smart_earning; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Real-IP $remote_addr; proxy_read_timeout 60s; }
  location / { proxy_pass http://smart_earning; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Real-IP $remote_addr; proxy_read_timeout 60s; }
}
